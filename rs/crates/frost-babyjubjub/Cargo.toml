[package]
name = "frost-babyjubjub"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Rust port of @railgun-reloaded/curves: BabyJubJub EdDSA-Poseidon, FROST (RFC 9591 style) and Feldman VSS / trusted DKG"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
blake2 = "0.10"
blake-hash = { version = "0.2", default-features = false }
aes-gcm = "0.10"
curve25519-dalek = "4.1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
getrandom = "0.2"

[dev-dependencies]
hex = "0.4"
